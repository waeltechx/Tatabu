name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The lock file is written by npm 12; older npm reads it as out of sync.
      - run: npm install -g npm@12.0.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npm run build
