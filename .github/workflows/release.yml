name: Release

# Push a tag like v1.0.0 to build the Windows and macOS installers and attach
# them to a draft GitHub Release. Publish the draft by hand after checking it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The lock file is written by npm 12; older npm reads it as out of sync.
      - run: npm install -g npm@12.0.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Build installer and upload to draft release
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
