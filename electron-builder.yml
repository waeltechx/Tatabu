appId: com.waeltechx.tatabu
productName: Tatabu
copyright: Copyright © 2026 waeltechx
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
publish:
  provider: github
  owner: waeltechx
  repo: Tatabu
  releaseType: draft

win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Tatabu-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: Tatabu
  uninstallDisplayName: Tatabu

mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.productivity
  # No paid Apple certificate: ad-hoc sign so Apple Silicon doesn't call the app "damaged".
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  artifactName: Tatabu-${version}-mac.${ext}
  extendInfo:
    NSMicrophoneUsageDescription: Tatabu uses the microphone only when you press the mic button to dictate text.
dmg:
  title: Tatabu ${version}
